name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      semver_bump:
        description: 'Semantic Version Bump (auto, patch, minor, major, custom)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version (if semver_bump is custom, e.g. 0.2.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Dynamic Semantic Version
        id: version_check
        run: |
          CARGO_VER=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          BUMP_TYPE="${{ github.event.inputs.semver_bump }}"
          CUSTOM_VER="${{ github.event.inputs.custom_version }}"
          
          # If triggered by tag, use tag version
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TARGET_VER="${GITHUB_REF_NAME#v}"
          elif [ -n "$CUSTOM_VER" ] && [ "$BUMP_TYPE" = "custom" ]; then
            TARGET_VER="${CUSTOM_VER#v}"
          else
            # Get latest tag or default to v0.1.0
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v${CARGO_VER}")
            TAG_VER="${LATEST_TAG#v}"
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG_VER:-0.1.0}"
            PATCH=$(echo "$PATCH" | cut -d'-' -f1 | cut -d'+' -f1)
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-1}
            PATCH=${PATCH:-0}
            
            case "${BUMP_TYPE:-auto}" in
              major)
                TARGET_VER="$((MAJOR + 1)).0.0"
                ;;
              minor)
                TARGET_VER="${MAJOR}.$((MINOR + 1)).0"
                ;;
              patch)
                TARGET_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
              auto|*)
                if git rev-parse "v${TAG_VER}" >/dev/null 2>&1 && [ "${GITHUB_REF_NAME}" = "main" ] && [ "${BUMP_TYPE}" = "patch" ]; then
                  TARGET_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"
                else
                  TARGET_VER="${TAG_VER}"
                fi
                ;;
            esac
          fi
          
          echo "Calculated Dynamic SemVer: ${TARGET_VER}"
          echo "version=${TARGET_VER}" >> $GITHUB_OUTPUT
          
          # Sync Cargo.toml if needed
          if [ "${TARGET_VER}" != "${CARGO_VER}" ]; then
            echo "Updating workspace Cargo.toml from ${CARGO_VER} to ${TARGET_VER}..."
            sed -i "s/^version = \"${CARGO_VER}\"/version = \"${TARGET_VER}\"/" Cargo.toml
          fi
          
          IS_PRERELEASE="false"
          if echo "${TARGET_VER}" | grep -qE "(alpha|beta|rc)"; then
            IS_PRERELEASE="true"
          fi
          echo "prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Ensure Git Tag Exists
        run: |
          TARGET_TAG="v${{ steps.version_check.outputs.version }}"
          if ! git ls-remote --tags origin | grep -q "refs/tags/${TARGET_TAG}$"; then
            echo "Tag ${TARGET_TAG} not found on remote origin. Creating tag automatically..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TARGET_TAG}" -m "Release ${TARGET_TAG}"
            git push origin "${TARGET_TAG}"
          else
            echo "Tag ${TARGET_TAG} already exists on remote origin."
          fi

      - name: Install system dependencies & appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libhidapi-dev \
            libudev-dev \
            libevdev-dev \
            libdbus-1-dev \
            desktop-file-utils \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-render0-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgl1-mesa-dev \
            curl \
            squashfs-tools
          
          # Install appimagetool for AppImage generation
          sudo curl -sSL -o /usr/local/bin/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Execute master packaging suite
        env:
          VERSION: ${{ steps.version_check.outputs.version }}
        run: |
          chmod +x packaging/build-all.sh packaging/deb/build-deb.sh packaging/appimage/build-appimage.sh
          ./packaging/build-all.sh

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate Release Notes
        run: |
          cat << 'EOF' > dist/release-notes.md
          # OpenRapoo Release ${{ steps.version_check.outputs.version }}

          Native Linux configuration tool & daemon for Rapoo MT760 Pro mouse and Rapoo devices.

          ## Highlights
          - 🎯 DPI Sensitivity & Polling Rate customization (125, 250, 500, 1000 Hz)
          - 🎛️ Button remapping via evdev/uinput daemon
          - 🔋 Real-time multi-provider battery monitoring (UPower, BlueZ, HID raw)
          - 🌐 Internationalization (English & Português do Brasil)
          - 📦 Packaged as `.deb` and standalone `AppImage`

          ## Installation

          ### Debian / Ubuntu (.deb)
          ```bash
          sudo dpkg -i openrapoo_${{ steps.version_check.outputs.version }}_amd64.deb
          sudo apt install -f
          ```

          ### AppImage (Standalone)
          ```bash
          chmod +x OpenRapoo-${{ steps.version_check.outputs.version }}-x86_64.AppImage
          ./OpenRapoo-${{ steps.version_check.outputs.version }}-x86_64.AppImage
          ```

          ---
          *Verify download integrity using `SHA256SUMS`.*
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_check.outputs.version }}
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: dist/release-notes.md
          prerelease: ${{ steps.version_check.outputs.prerelease == 'true' }}
          draft: false
