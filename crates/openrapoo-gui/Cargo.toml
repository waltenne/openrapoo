[package]
name = "openrapoo-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GTK4 + libadwaita GUI interface for OpenRapoo (Phase 5)"

[[bin]]
name = "openrapoo-gui"
path = "src/main.rs"

[dependencies]
openrapoo-core = { path = "../openrapoo-core" }

gtk4 = { version = "0.9", features = ["v4_12"], optional = true }
libadwaita = { version = "0.7", features = ["v1_5"], optional = true }

thiserror.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
tokio.workspace = true
dirs.workspace = true

[features]
default = []
gtk = ["dep:gtk4"]
adw = ["gtk", "dep:libadwaita"]

