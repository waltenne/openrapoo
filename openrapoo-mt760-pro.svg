<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Rapoo MT760 Pro - mapa de controles</title>
  <desc id="desc">Ilustracao vetorial de um mouse Rapoo MT760 Pro com pontos interativos para seus controles.</desc>

  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d414a"/>
      <stop offset="0.42" stop-color="#171a20"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="leftShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35c759"/>
      <stop offset="1" stop-color="#0b6e35"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#525762"/>
      <stop offset="0.5" stop-color="#d0d3d8"/>
      <stop offset="1" stop-color="#363a43"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="18" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="selected-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { font: 600 22px Cantarell, Inter, sans-serif; fill: #667085; }
      .sub { font: 400 18px Cantarell, Inter, sans-serif; fill: #98a2b3; }
      .line { fill: none; stroke: #a8b1df; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .hotspot { cursor: pointer; }
      .hotspot circle { fill: #b8b9ea; stroke: #f5f5ff; stroke-width: 4; }
      .hotspot { transform-box: fill-box; transform-origin: center; }
      .hotspot:hover circle, .hotspot.active circle, .hotspot.selected circle { fill: #45d369; stroke: #d8ffe1; }
      .hotspot:focus circle, .hotspot.selected circle { stroke: #111827; stroke-width: 5; filter: url(#selected-glow); }
      .hotspot:active, .hotspot.pressed { animation: button-press 180ms ease-out; }
      .hotspot.selected { animation: selected-pulse 1.8s ease-in-out infinite; }
      .hotspot.scroll-up { animation: scroll-up 320ms ease-out; }
      .hotspot.scroll-down { animation: scroll-down 320ms ease-out; }
      .hotspot.scroll-left { animation: scroll-left 320ms ease-out; }
      .hotspot.scroll-right { animation: scroll-right 320ms ease-out; }
      .hotspot.disabled { opacity: .35; filter: grayscale(1); }
      @keyframes button-press { 0% { transform: scale(1); } 45% { transform: scale(1.28); } 100% { transform: scale(1); } }
      @keyframes selected-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
      @keyframes scroll-up { 0% { transform: translateY(0); } 50% { transform: translateY(-9px); } 100% { transform: translateY(0); } }
      @keyframes scroll-down { 0% { transform: translateY(0); } 50% { transform: translateY(9px); } 100% { transform: translateY(0); } }
      @keyframes scroll-left { 0% { transform: translateX(0); } 50% { transform: translateX(-9px); } 100% { transform: translateX(0); } }
      @keyframes scroll-right { 0% { transform: translateX(0); } 50% { transform: translateX(9px); } 100% { transform: translateX(0); } }
      @media (prefers-reduced-motion: reduce) {
        .hotspot, .hotspot.selected { animation: none !important; transition: none !important; }
      }
      .hotspot text { pointer-events: none; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>

  <!-- linhas de conexao -->
  <g aria-hidden="true">
    <path class="line" d="M55 112 H284 L548 230"/>
    <path class="line" d="M55 220 H284 L455 420"/>
    <path class="line" d="M55 328 H284 L420 478"/>
    <path class="line" d="M55 465 H285 L382 428"/>
    <path class="line" d="M55 573 H292 L413 505"/>
    <path class="line" d="M1145 76 H934 L608 236"/>
    <path class="line" d="M1145 184 H944 L604 251"/>
    <path class="line" d="M1145 292 H948 L585 267"/>
    <path class="line" d="M1145 420 H928 L672 345"/>
    <path class="line" d="M1145 548 H922 L575 385"/>
    <path class="line" d="M1145 676 H902 L515 458"/>
  </g>

  <!-- mouse -->
  <g id="rapoo-mt760-pro" filter="url(#shadow)" transform="translate(330 92)">
    <path d="M252 25 C356 15 489 77 548 188 C604 294 604 468 553 591 C503 711 388 735 278 695 C170 656 93 575 74 469 C54 356 103 275 172 207 C217 162 243 115 252 25Z" fill="url(#body)" stroke="#0d0f14" stroke-width="7"/>
    <path d="M252 25 C265 111 299 176 349 218 L374 306 C326 289 270 257 218 210 C193 160 195 84 252 25Z" fill="url(#leftShell)" stroke="#101319" stroke-width="5"/>
    <path d="M252 25 C320 21 405 50 465 103 L349 218 C302 177 267 109 252 25Z" fill="#484c55" stroke="#11131a" stroke-width="5"/>
    <path d="M349 218 C402 190 442 153 465 103 C501 147 526 208 538 274 C488 304 431 321 374 306Z" fill="#282c34"/>
    <path d="M374 306 C430 321 488 304 538 274 C566 392 554 526 509 604 C477 659 418 685 350 676 C390 578 401 424 374 306Z" fill="#12151b" opacity=".92"/>
    <path d="M218 210 C263 257 325 290 374 306 C399 422 390 574 350 676 C274 673 201 641 157 583 C117 530 91 465 92 399 C95 333 141 267 218 210Z" fill="#1b1f27" opacity=".98"/>

    <!-- divisao dos botoes principais -->
    <path d="M349 218 C346 252 354 281 374 306" fill="none" stroke="#090b0f" stroke-width="5"/>
    <path d="M350 307 C341 274 319 244 286 214" fill="none" stroke="#555a65" stroke-width="3" opacity=".45"/>

    <!-- roda principal -->
    <g id="roller" class="hotspot" tabindex="0" aria-label="Roda e clique do meio">
      <rect x="347" y="111" width="42" height="129" rx="20" fill="url(#wheel)" stroke="#0d0f14" stroke-width="6" transform="rotate(-10 368 175)"/>
      <path d="M355 132 l28 -5 M351 149 l29 -5 M349 166 l29 -5 M348 184 l28 -5 M349 202 l27 -5" stroke="#262a32" stroke-width="5" opacity=".8"/>
    </g>

    <!-- roda lateral -->
    <g id="thumb-wheel" class="hotspot" tabindex="0" aria-label="Roda lateral">
      <rect x="181" y="330" width="39" height="112" rx="18" fill="url(#wheel)" stroke="#080a0e" stroke-width="6" transform="rotate(-20 200 386)"/>
      <path d="M181 344 l31 10 M176 361 l31 10 M173 379 l31 10 M170 397 l31 10 M168 415 l30 10" stroke="#22262e" stroke-width="5"/>
    </g>

    <!-- botoes laterais -->
    <g id="back" class="hotspot" tabindex="0" aria-label="Botao voltar"><rect x="224" y="274" width="32" height="92" rx="12" fill="#626872" transform="rotate(-17 240 320)"/></g>
    <g id="forward" class="hotspot" tabindex="0" aria-label="Botao avancar"><rect x="245" y="371" width="32" height="92" rx="12" fill="#626872" transform="rotate(-17 261 417)"/></g>
    <g id="dpi" class="hotspot" tabindex="0" aria-label="Botao DPI"><rect x="400" y="279" width="28" height="74" rx="12" fill="#858b95" transform="rotate(-7 414 316)"/></g>
    <g id="device-switch" class="hotspot" tabindex="0" aria-label="Troca de dispositivo"><circle cx="449" cy="383" r="14" fill="#7e8590"/></g>

    <!-- logotipo discreto -->
    <text x="278" y="170" fill="#aeb4bd" opacity=".72" font-family="Cantarell, sans-serif" font-size="21" font-weight="700" transform="rotate(39 278 170)">rapoo</text>
    <ellipse cx="435" cy="485" rx="7" ry="12" fill="#53e76d" filter="url(#soft)"/>
  </g>

  <!-- hotspots e rotulos -->
  <g id="labels">
    <g id="hotspot-left" class="hotspot" tabindex="0" aria-label="Botao esquerdo"><circle cx="55" cy="112" r="10"/><text class="label" x="78" y="104">Left</text><text class="sub" x="78" y="130">Clique esquerdo</text></g>
    <g id="hotspot-roller-left" class="hotspot" tabindex="0" aria-label="Roda para esquerda"><circle cx="55" cy="220" r="10"/><text class="label" x="78" y="212">Roller left</text><text class="sub" x="78" y="238">Roda lateral esquerda</text></g>
    <g id="hotspot-roller-right" class="hotspot" tabindex="0" aria-label="Roda para direita"><circle cx="55" cy="328" r="10"/><text class="label" x="78" y="320">Roller right</text><text class="sub" x="78" y="346">Roda lateral direita</text></g>
    <g id="hotspot-forward" class="hotspot" tabindex="0" aria-label="Botao avancar"><circle cx="55" cy="465" r="10"/><text class="label" x="78" y="457">Forward</text><text class="sub" x="78" y="483">Botao avancar</text></g>
    <g id="hotspot-back" class="hotspot" tabindex="0" aria-label="Botao voltar"><circle cx="55" cy="573" r="10"/><text class="label" x="78" y="565">Back</text><text class="sub" x="78" y="591">Botao voltar</text></g>

    <g id="hotspot-roller-forward" class="hotspot" tabindex="0" aria-label="Roda para frente"><circle cx="1145" cy="76" r="10"/><text class="label" x="1118" y="68" text-anchor="end">Roller forward</text><text class="sub" x="1118" y="94" text-anchor="end">Rolar para cima</text></g>
    <g id="hotspot-middle" class="hotspot" tabindex="0" aria-label="Clique do meio"><circle cx="1145" cy="184" r="10"/><text class="label" x="1118" y="176" text-anchor="end">Middle</text><text class="sub" x="1118" y="202" text-anchor="end">Clique do meio</text></g>
    <g id="hotspot-roller-back" class="hotspot" tabindex="0" aria-label="Roda para tras"><circle cx="1145" cy="292" r="10"/><text class="label" x="1118" y="284" text-anchor="end">Roller back</text><text class="sub" x="1118" y="310" text-anchor="end">Rolar para baixo</text></g>
    <g id="hotspot-right" class="hotspot" tabindex="0" aria-label="Botao direito"><circle cx="1145" cy="420" r="10"/><text class="label" x="1118" y="412" text-anchor="end">Right</text><text class="sub" x="1118" y="438" text-anchor="end">Clique direito</text></g>
    <g id="hotspot-dpi" class="hotspot" tabindex="0" aria-label="Botao DPI"><circle cx="1145" cy="548" r="10"/><text class="label" x="1118" y="540" text-anchor="end">DPI</text><text class="sub" x="1118" y="566" text-anchor="end">Somente se detectado</text></g>
    <g id="hotspot-device-switch" class="hotspot" tabindex="0" aria-label="Troca de dispositivo"><circle cx="1145" cy="676" r="10"/><text class="label" x="1118" y="668" text-anchor="end">Device switch</text><text class="sub" x="1118" y="694" text-anchor="end">Somente se detectado</text></g>
  </g>
</svg>
