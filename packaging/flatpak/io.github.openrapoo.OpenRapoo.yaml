app-id: io.github.openrapoo.OpenRapoo
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: openrapoo-gui

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Input devices & uinput / evdev access
  - --device=all

  # Storage for profiles and logs
  - --filesystem=xdg-config/openrapoo:create
  - --filesystem=xdg-data/openrapoo:create

  # Notifications
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/openrapoo/cargo

modules:
  - name: openrapoo
    buildsystem: simple
    build-commands:
      - cargo build --release --workspace
      - install -Dm755 target/release/openrapoo-gui /app/bin/openrapoo-gui
      - install -Dm755 target/release/openrapoo-daemon /app/bin/openrapoo-daemon
      - install -Dm755 target/release/openrapoo-diag /app/bin/openrapoo-diag
      - install -Dm644 packaging/io.github.openrapoo.OpenRapoo.desktop /app/share/applications/io.github.openrapoo.OpenRapoo.desktop
      - install -Dm644 packaging/io.github.openrapoo.OpenRapoo.metainfo.xml /app/share/metainfo/io.github.openrapoo.OpenRapoo.metainfo.xml
      - install -Dm644 packaging/icons/io.github.openrapoo.OpenRapoo.svg /app/share/icons/hicolor/scalable/apps/io.github.openrapoo.OpenRapoo.svg
    sources:
      - type: dir
        path: ../..

